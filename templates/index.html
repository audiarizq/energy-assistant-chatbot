{% extends "base.html" %}

{% block content %}
<section class="hero">
  <h1>EnergyBot</h1>
  <p>Asisten rule-based untuk menghitung dan menghemat energi listrik.</p>
</section>

<section class="theme-grid">
  {% for t in themes %}
  <a class="theme-card" href="{{ url_for('chat_page', theme_id=t.id) }}" style="--card: {{ t.color }};">
    <div class="theme-avatar">{{ t.avatar }}</div>
    <h2>{{ t.name }}</h2>
    <p>{{ t.description }}</p>
    <span class="theme-meta">{{ t.intents | length }} intent &middot; bot: {{ t.bot_name }}</span>
  </a>
  {% endfor %}
</section>
{% endblock %}
